name: Probe SSH from runner
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "Command to run on the host"
        required: false
        default: "echo ok"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: SSH and report
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.OVH_SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ns5037844.ip-51-161-112.net >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 ubuntu@ns5037844.ip-51-161-112.net "${{ inputs.cmd }}"
