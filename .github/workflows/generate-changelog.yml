name: Generate Changelog

on:
  push:
    branches: [ main ]
    paths-ignore:
      - .github/workflows/xlaunch-helper.yml
      - .github/workflows/xlaunch-helper-next.yml
      - .github/workflows/xlaunch-realtime.yml
      - .github/workflows/xlaunch-realtime-next.yml
      - .github/workflows/pr-quality.yaml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          if git diff --quiet --cached; then
            echo "No changelog changes to commit"
            exit 0
          fi
          git commit -m "docs: update changelog"
          git push https://${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git HEAD:${GITHUB_REF_NAME}
