name: Build Xlaunch (SHA)

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

env:
  GITHUB_REGISTRY: ghcr.io
  # The image lives in this repository's own package namespace: pushing to the northlatch or docker
  # hub namespaces needs credentials this repository does not hold.
  IMAGE_NAME: "gridframe-systems-llc/gridframes"

jobs:
  build-push:
    outputs:
      short_sha: ${{ steps.version.outputs.short_sha }}
    # The production host is amd64. Cross-arch builds on this private repository add a runner this
    # org does not have, for an image nothing here pulls.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve internal version
        id: version
        run: |
          BASE_VERSION=$(sed -n "s/.*?: '\([0-9]*\.[0-9]*\.[0-9]*\)'.*/\1/p" config/constants.php | head -1)
          echo "version=${BASE_VERSION}-dev.${GITHUB_SHA::9}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch the MinIO client binary
        run: scripts/fetch-minio-mc.sh

      - name: Set up build
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            XLAUNCH_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.version.outputs.short_sha }}
            ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:main
