services:
    xlaunch:
        container_name: xlaunch
        restart: always
        working_dir: /var/www/html
        extra_hosts:
            - host.docker.internal:host-gateway
        networks:
            - xlaunch
        depends_on:
            - postgres
            - redis
            - soketi
    postgres:
        image: postgres:15-alpine
        container_name: xlaunch-db
        restart: always
        networks:
            - xlaunch
    redis:
        image: redis:7-alpine
        container_name: xlaunch-redis
        restart: always
        networks:
            - xlaunch
    soketi:
        container_name: xlaunch-realtime
        extra_hosts:
            - host.docker.internal:host-gateway
        restart: always
        networks:
            - xlaunch
networks:
    xlaunch:
        name: xlaunch
        driver: bridge
        external: false
